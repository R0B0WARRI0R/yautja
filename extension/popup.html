<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 280px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .logo {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: linear-gradient(135deg, #f85149, #6e7681);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .header h1 {
      font-size: 15px;
      font-weight: 600;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .status.connected {
      background: rgba(63, 185, 80, 0.1);
      border: 1px solid rgba(63, 185, 80, 0.3);
    }
    .status.disconnected {
      background: rgba(248, 81, 73, 0.1);
      border: 1px solid rgba(248, 81, 73, 0.3);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.on { background: #3fb950; box-shadow: 0 0 6px #3fb950; }
    .dot.off { background: #f85149; }
    .status-text { font-size: 12px; }
    .meta {
      font-size: 11px;
      color: #6e7681;
      margin-top: 8px;
    }
    .tabs-info {
      font-size: 11px;
      color: #8b949e;
      padding: 8px 12px;
      background: #161b22;
      border-radius: 6px;
      margin-top: 8px;
    }
    button {
      width: 100%;
      padding: 8px;
      border: 1px solid #30363d;
      border-radius: 6px;
      background: #21262d;
      color: #c9d1d9;
      font-size: 12px;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover { background: #30363d; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">Y</div>
    <h1>Yautja Bridge</h1>
  </div>
  <div class="status disconnected" id="status">
    <div class="dot off" id="dot"></div>
    <span class="status-text" id="statusText">Disconnected</span>
  </div>
  <div class="tabs-info" id="tabsInfo">No tabs attached</div>
  <div class="meta" id="meta">ws://localhost:9876</div>
  <button id="reconnect">Reconnect</button>

  <script src="popup.js"></script>
</body>
</html>
